<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UNSEEN</title>
<style>
:root{
  --bg:#050608;--panel:#0d1015;--line:#29313b;--text:#edf2f7;
  --muted:#8d98a5;--accent:#b9e7ff;--danger:#ff4d61;--good:#70e6a1;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
button{font:inherit;color:inherit}
.screen{min-height:100%;display:none}
.screen.active{display:flex}
#selectScreen{align-items:center;justify-content:center;padding:12px}
.select-wrap{width:min(1200px,96vw);max-height:96vh;display:flex;flex-direction:column}
.brand{text-align:center;margin:4px 0 10px}
.brand h1{margin:0;font-size:clamp(34px,7vw,64px);letter-spacing:.22em;font-weight:800}
.brand p{margin:4px 0;color:var(--muted);letter-spacing:.18em;font-size:11px}
#startGameBtn{
  order:-1;width:100%;margin:0 0 12px;padding:15px 20px;border:1px solid #87d8ff;
  border-radius:10px;background:#101b25;box-shadow:0 0 24px #5cc8ff20;
  font-weight:800;letter-spacing:.12em;cursor:pointer
}
#startGameBtn:disabled{opacity:.35;cursor:not-allowed}
.map-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.map-card{
  min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:.15s;position:relative
}
.map-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px #b9e7ff20,0 0 28px #8bdcff18;transform:translateY(-2px)}
.map-art{height:clamp(150px,28vh,280px);display:grid;place-items:center;position:relative;overflow:hidden}
.map-art:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 50% 35%,#ffffff12,transparent 28%),
 linear-gradient(135deg,#111820,#030405 70%)}
.metro .map-art:after{content:"";width:75%;height:3px;background:#8ccfff;box-shadow:-100px 40px 0 #40505d,120px -55px 0 #40505d;opacity:.55}
.forest .map-art:after{content:"▲ ▲ ▲ ▲";font-size:70px;letter-spacing:4px;opacity:.15}
.water .map-art:after{content:"≈ ≈ ≈ ≈";font-size:60px;opacity:.18}
.map-num{position:absolute;top:10px;left:10px;color:#aeb9c4;font-size:10px;letter-spacing:.2em}
.map-body{padding:12px}
.map-body h2{margin:0 0 4px;font-size:19px}
.map-body p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.select-mark{position:absolute;right:10px;top:10px;border:1px solid #ffffff30;border-radius:999px;padding:3px 8px;font-size:10px;background:#0008}
.map-card.selected .select-mark{background:#d9f4ff;color:#071017;border-color:#d9f4ff}
.hint{text-align:center;color:#68727e;font-size:11px;margin:10px 0 0}

#gameScreen{flex-direction:column}
.topbar{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:#080a0e}
.logo{font-weight:900;letter-spacing:.18em}
.stat{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.badge{padding:5px 8px;border:1px solid var(--line);border-radius:7px}
#safety{font-weight:800;color:var(--good)}
.game-main{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.scene{position:relative;min-height:0;overflow:hidden;background:
 radial-gradient(circle at 55% 38%,#28313a 0,#10151b 24%,#050608 68%)}
.scene .vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px #000;pointer-events:none}
.location{position:absolute;left:16px;top:14px;font-size:12px;letter-spacing:.12em;color:#c5ced8}
.event{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70%,560px);text-align:center;padding:22px}
.event .symbol{font-size:64px;opacity:.25}
.event h2{margin:8px 0;font-size:clamp(20px,4vw,34px)}
.event p{color:#aab4bf;line-height:1.6;margin:0}
.flash{animation:flash .35s}
@keyframes flash{50%{filter:brightness(2) contrast(1.4)}}
.side{border-left:1px solid var(--line);background:#090b0f;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.panel{border:1px solid var(--line);border-radius:9px;padding:10px;background:#0d1015}
.panel h3{margin:0 0 7px;font-size:11px;letter-spacing:.12em;color:#9ba6b1}
#log{height:160px;overflow:auto;font-size:11px;line-height:1.5;color:#aeb8c2}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.actions button,.wide{
  border:1px solid var(--line);background:#12171d;border-radius:7px;padding:10px;cursor:pointer;font-size:12px
}
.actions button:active,.wide:active{transform:scale(.98)}
.wide{width:100%;margin-top:auto}
.bar{height:8px;background:#1b2027;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:100%;background:var(--good);transition:.3s}
#resultScreen{align-items:center;justify-content:center;padding:20px;text-align:center}
.result-box{width:min(600px,94vw);border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:28px}
.result-box h1{font-size:48px;letter-spacing:.18em;margin:0 0 10px}
.result-box p{color:var(--muted)}
#restartBtn{margin-top:18px;width:100%;padding:14px;border:1px solid #87d8ff;background:#101b25;border-radius:9px;font-weight:800}

@media (orientation:landscape) and (max-height:600px){
  #selectScreen{padding:7px}
  .brand{margin:0 0 5px}.brand h1{font-size:30px}.brand p{display:none}
  #startGameBtn{padding:9px;margin-bottom:7px}
  .map-grid{gap:8px}
  .map-art{height:calc(100vh - 185px);min-height:125px}
  .map-body{padding:7px}.map-body h2{font-size:15px}.map-body p{font-size:10px}
  .hint{display:none}
}
@media(max-width:700px) and (orientation:portrait){
  #selectScreen{overflow:auto;align-items:flex-start}
  .map-grid{grid-template-columns:1fr}
  .map-art{height:150px}
  .game-main{grid-template-columns:1fr}
  .side{border-left:0;border-top:1px solid var(--line);max-height:38vh}
}
</style>
</head>
<body>

<section id="selectScreen" class="screen active">
  <div class="select-wrap">
    <div class="brand">
      <h1>UNSEEN</h1>
      <p>THERE ARE PLACES THAT SHOULD NOT BE SEEN</p>
    </div>

    <button id="startGameBtn" disabled>決定・調査開始</button>

    <div class="map-grid">
      <article class="map-card metro" data-map="地下鉄">
        <div class="map-art"><span class="map-num">MAP 01</span><span class="select-mark">選択</span></div>
        <div class="map-body"><h2>地下鉄</h2><p>終電後も、存在しない駅に列車が止まる。</p></div>
      </article>
      <article class="map-card forest" data-map="森林">
        <div class="map-art"><span class="map-num">MAP 02</span><span class="select-mark">選択</span></div>
        <div class="map-body"><h2>森林</h2><p>道を戻るたび、木の数がひとつ増えている。</p></div>
      </article>
      <article class="map-card water" data-map="水没都市">
        <div class="map-art"><span class="map-num">MAP 03</span><span class="select-mark">選択</span></div>
        <div class="map-body"><h2>水没都市</h2><p>水面の下に、こちらを見上げる人影がある。</p></div>
      </article>
    </div>
    <div class="hint">マップを選択すると上の「決定・調査開始」が有効になります。</div>
  </div>
</section>

<section id="gameScreen" class="screen">
  <header class="topbar">
    <div class="logo">UNSEEN</div>
    <div class="stat">
      <span class="badge" id="mapName">---</span>
      <span class="badge">残り <b id="time">05:00</b></span>
      <span class="badge">安全度 <b id="safety">3</b></span>
    </div>
  </header>
  <main class="game-main">
    <div class="scene" id="scene">
      <div class="location" id="location">UNKNOWN</div>
      <div class="event">
        <div class="symbol" id="symbol">?</div>
        <h2 id="eventTitle">調査を開始した。</h2>
        <p id="eventText">何もない。……今のところは。</p>
      </div>
      <div class="vignette"></div>
    </div>
    <aside class="side">
      <div class="panel"><h3>安全度</h3><div class="bar"><i id="safetyBar"></i></div></div>
      <div class="panel"><h3>記録</h3><div id="log"></div></div>
      <div class="panel">
        <h3>行動</h3>
        <div class="actions">
          <button data-action="move">移動する</button>
          <button data-action="observe">観察する</button>
          <button data-action="photo">撮影する</button>
          <button data-action="wait">待つ</button>
        </div>
      </div>
      <button class="wide" id="escapeBtn">脱出を試みる</button>
    </aside>
  </main>
</section>

<section id="resultScreen" class="screen">
  <div class="result-box">
    <h1 id="resultTitle">UNSEEN</h1>
    <p id="resultText"></p>
    <div id="resultStats"></div>
    <button id="restartBtn">タイトルへ戻る</button>
  </div>
</section>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  let selected = null, safety = 3, timeLeft = 300, timer = null, moves = 0, anomalies = 0;

  const events = [
    ["移動する","廊下の先で、足音がひとつだけ遅れて聞こえた。","👣",0],
    ["観察する","壁の案内板に、存在しない出口が追加されている。","◉",-1],
    ["撮影する","写真には、撮影時にはいなかった人影が写った。","📷",-1],
    ["待つ","時計の秒針が止まった。あなた以外の時間だけが止まったようだ。","⏱",0],
    ["異常","背後から名前を呼ばれた。振り返ってはいけない。","◌",-1],
    ["異常","地図上の現在地が、ゆっくりこちらへ近づいている。","⊙",-1],
    ["異常","遠くにいるはずのものが、瞬きをした瞬間だけ近くにいる。","●",-1],
    ["静寂","何も起きない。だからこそ、不自然だった。","…",0]
  ];

  function show(id){
    $$(".screen").forEach(x=>x.classList.remove("active"));
    $(id).classList.add("active");
  }
  function log(t){
    const d=document.createElement("div");
    d.textContent="› "+t;
    $("#log").prepend(d);
  }
  function safetyUpdate(delta){
    safety=Math.max(0,Math.min(3,safety+delta));
    $("#safety").textContent=safety;
    $("#safetyBar").style.width=(safety/3*100)+"%";
    if(safety===0) setTimeout(()=>finish(false,"安全度が0になった。ここから先は、あなたの記録に残っていない。"),350);
  }
  function randomEvent(action){
    moves++;
    let e=events[Math.floor(Math.random()*events.length)];
    if(action==="photo" && Math.random()<.45) e=["写真の端に、知らない駅名が写った。","撮影した瞬間、画面の中だけが暗くなった。","📷",-1];
    if(Math.random()<.25) e=[...e.slice(0,3),-1];
    $("#eventTitle").textContent=e[0];
    $("#eventText").textContent=e[1];
    $("#symbol").textContent=e[2];
    $("#location").textContent=selected+" / SECTOR "+String(1+Math.floor(Math.random()*9)).padStart(2,"0");
    $("#scene").classList.remove("flash"); void $("#scene").offsetWidth; $("#scene").classList.add("flash");
    if(e[3]<0){anomalies++;safetyUpdate(e[3]);}
    log(e[1]);
  }
  function start(){
    clearInterval(timer);
    safety=3;timeLeft=300;moves=0;anomalies=0;
    $("#mapName").textContent=selected;
    $("#time").textContent="05:00";
    $("#log").innerHTML="";
    $("#safety").textContent="3";$("#safetyBar").style.width="100%";
    log(selected+"の調査を開始。");
    show("#gameScreen");
    randomEvent("start");
    timer=setInterval(()=>{
      timeLeft--;
      const m=String(Math.floor(timeLeft/60)).padStart(2,"0");
      const s=String(timeLeft%60).padStart(2,"0");
      $("#time").textContent=m+":"+s;
      if(timeLeft<=0) finish(false,"時間切れ。帰るための道が、もう見つからない。");
    },1000);
  }
  function finish(success,msg){
    clearInterval(timer);
    $("#resultTitle").textContent=success?"ESCAPED":"UNSEEN";
    $("#resultText").textContent=msg;
    $("#resultStats").innerHTML=`<p>場所：${selected}<br>安全度：${safety}/3<br>行動回数：${moves}<br>異常記録：${anomalies}</p>`;
    show("#resultScreen");
  }

  $$(".map-card").forEach(card=>{
    card.addEventListener("click",()=>{
      $$(".map-card").forEach(c=>c.classList.remove("selected"));
      card.classList.add("selected");
      selected=card.dataset.map;
      $("#startGameBtn").disabled=false;
      $("#startGameBtn").textContent=`【 ${selected} 】決定・調査開始`;
    });
  });
  $("#startGameBtn").addEventListener("click",()=>{if(selected)start()});
  $$(".actions button").forEach(b=>b.addEventListener("click",()=>randomEvent(b.dataset.action)));
  $("#escapeBtn").addEventListener("click",()=>{
    if(moves>=5 && safety>=1) finish(true,"出口を見つけた。だが、帰還者はあなた一人だった。");
    else { log("出口を探したが、まだ条件を満たしていない。"); safetyUpdate(-1); }
  });
  $("#restartBtn").addEventListener("click",()=>{selected=null;$$(".map-card").forEach(c=>c.classList.remove("selected"));$("#startGameBtn").disabled=true;$("#startGameBtn").textContent="決定・調査開始";show("#selectScreen")});
})();
</script>
</body>
</html>
