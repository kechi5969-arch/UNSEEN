<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>UNSEEN — 地下鉄ホーム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eef7fa;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}#title{position:absolute;top:14px;left:16px;font-weight:900;letter-spacing:.22em;font-size:13px}#station{position:absolute;top:38px;left:16px;color:#aebcc4;font-size:11px}
#objective{position:absolute;left:16px;top:70px;max-width:330px;padding:9px 11px;border:1px solid #ffffff22;border-radius:9px;background:#05090dcc;font-size:12px}#hint{position:absolute;right:14px;top:14px;color:#aeb8bf;font-size:10px;text-align:right}#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#dff7ff;border-radius:50%;box-shadow:0 0 8px #9fe7ff}
#message{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:min(88vw,520px);text-align:center;padding:12px 16px;border-radius:10px;background:#020405d9;border:1px solid #ffffff1a;font-size:13px;opacity:0;transition:opacity .25s}.show{opacity:1!important}
#danger{position:absolute;inset:0;background:#ff001010;box-shadow:inset 0 0 110px #f001;opacity:0;transition:opacity .2s}
#touch{position:fixed;inset:0;z-index:10;pointer-events:none}#stick{position:absolute;left:20px;bottom:28px;width:128px;height:128px;border:1px solid #ffffff24;border-radius:50%;background:#ffffff08;pointer-events:auto;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#dff8ff18;border:1px solid #dff8ff55}
#look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none}#interact,#flashBtn{position:absolute;border-radius:50%;border:1px solid #bcefff55;background:#081117bb;color:#dff8ff;pointer-events:auto;touch-action:manipulation}#interact{right:22px;bottom:42px;width:70px;height:70px;font-weight:800}#flashBtn{right:104px;bottom:52px;width:50px;height:50px}
#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#17222b,#030405 65%);padding:24px}#startBox{width:min(520px,92vw);padding:28px;border:1px solid #ffffff22;border-radius:16px;background:#070a0edb;text-align:center}#startBox h1{margin:0 0 8px;font-size:42px;letter-spacing:.2em}#startBox p{margin:8px 0;color:#aab7bf;line-height:1.6;font-size:13px}#startBtn{margin-top:14px;width:100%;padding:14px;border-radius:10px;border:1px solid #9fe7ff88;background:#0c2029;color:#eafaff;font-weight:900}
#menu{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.28)),radial-gradient(circle at 72% 38%,#25333c,#050607 68%);padding:clamp(24px,5vw,70px)}
#menu .menuInner{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;width:min(720px,92vw);margin:auto}
.logo{font-size:clamp(54px,11vw,108px);font-weight:950;letter-spacing:.22em;text-shadow:0 0 28px #b9efff44;margin-bottom:32px}
.menuButtons{display:flex;flex-direction:column;gap:12px;width:min(330px,80vw)}
.menuBtn{padding:15px 20px;text-align:left;border:1px solid #dff8ff44;border-radius:8px;background:#071015cc;color:#effcff;font-weight:900;letter-spacing:.16em;cursor:pointer}
.menuBtn:hover{background:#12303bcc;border-color:#dff8ff99}
#subMenu{position:fixed;inset:0;z-index:31;display:none;background:#050708f2;padding:30px}
.panel{width:min(620px,92vw);margin:auto;padding:28px;border:1px solid #ffffff22;border-radius:14px;background:#091014f5}
.panel h2{letter-spacing:.16em;margin-top:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:22px;border:1px solid #ffffff25;border-radius:10px;background:#10191dcc;cursor:pointer}.card:hover{border-color:#bcefff99}.back{margin-top:18px;background:none;border:0;color:#9eafb8;cursor:pointer}
.setting{margin:22px 0}.setting label{display:flex;justify-content:space-between;margin-bottom:8px}.setting input{width:100%}
@media(min-width:800px){#stick,#look,#interact,#flashBtn{display:none}}
</style></head><body>
<div id="start"><div id="startBox"><h1>UNSEEN</h1><p>地下鉄ホーム — PROTOTYPE 01</p><p>終電後の駅を調査する。<br>……ただし、駅員の案内を信用してはいけない。</p><button id="startBtn">調査を開始</button></div></div>
<div id="menu"><div class="menuInner"><div class="logo">UNSEEN</div><div class="menuButtons"><button class="menuBtn" id="soloBtn">SOLO</button><button class="menuBtn" id="multiBtn">MULTIPLAYER</button><button class="menuBtn" id="settingsBtn">SETTINGS</button></div></div></div>
<div id="subMenu"><div class="panel" id="mapPanel">
<h2 id="panelTitle">SELECT MAP</h2><div class="cards"><div class="card" data-map="zero"><b>ZERO STATION</b><br><small>地下鉄・第零駅</small></div><div class="card" data-map="night"><b>NIGHT PLATFORM</b><br><small>深夜のホーム</small></div></div><button class="back" id="backBtn">← BACK</button>
</div>
<div class="panel" id="settingsPanel" style="display:none"><h2>SETTINGS</h2>
<div class="setting"><label>感度 <span id="sensVal">1.0</span></label><input id="sens" type="range" min=".4" max="2" step=".1" value="1"></div>
<div class="setting"><label>明るさ <span id="brightVal">1.0</span></label><input id="bright" type="range" min=".5" max="1.5" step=".1" value="1"></div>
<button class="back" id="settingsBack">← BACK</button></div></div>
<div id="hud"><div id="title">UNSEEN</div><div id="station">地下鉄 / 第零駅</div><div id="objective">目的：ホームを調査する</div><div id="hint">PC: WASD / マウス　　iPhone: 左スティック / 右側ドラッグ</div><div id="crosshair"></div><div id="danger"></div><div id="message"></div></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div id="look"></div><button id="flashBtn">LIGHT</button><button id="interact">調査</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030506);
scene.fog = new THREE.FogExp2(0x030506, 0.028);

const camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, 0.05, 220);
camera.position.set(0, 1.72, 14);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const world = new THREE.Group();
scene.add(world);

const M = {
  floor: new THREE.MeshStandardMaterial({ color: 0x3a3f42, roughness: 0.92 }),
  floorDark: new THREE.MeshStandardMaterial({ color: 0x2a2e31, roughness: 0.95 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x4a5256, roughness: 0.78 }),
  tile: new THREE.MeshStandardMaterial({ color: 0xc8d0d4, roughness: 0.55 }),
  tileDark: new THREE.MeshStandardMaterial({ color: 0x8a9499, roughness: 0.65 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x111517, roughness: 0.95 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x5a6368, roughness: 0.35, metalness: 0.75 }),
  train: new THREE.MeshStandardMaterial({ color: 0x6a7278, roughness: 0.28, metalness: 0.85 }),
  trainDark: new THREE.MeshStandardMaterial({ color: 0x3a4045, roughness: 0.4, metalness: 0.7 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xe0b020, roughness: 0.55 }),
  white: new THREE.MeshStandardMaterial({ color: 0xe8eef0, roughness: 0.5 }),
  black: new THREE.MeshStandardMaterial({ color: 0x080a0b, roughness: 1 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x9ed8df, roughness: 0.12, metalness: 0.15, transparent: true, opacity: 0.28 }),
  glassDark: new THREE.MeshStandardMaterial({ color: 0x1a2830, roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.55 }),
  ad: new THREE.MeshStandardMaterial({ color: 0x182a31, roughness: 0.65 }),
  red: new THREE.MeshStandardMaterial({ color: 0x9d1c22, roughness: 0.7 }),
  bench: new THREE.MeshStandardMaterial({ color: 0x5c4030, roughness: 0.75 }),
  seat: new THREE.MeshStandardMaterial({ color: 0x2a5a6a, roughness: 0.6 })
};

function box(n, x, y, z, sx, sy, sz, m, cast = false) {
  const q = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
  q.name = n;
  q.position.set(x, y, z);
  q.castShadow = cast;
  q.receiveShadow = true;
  world.add(q);
  return q;
}
function cyl(n, x, y, z, r, h, m, segs = 16) {
  const q = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segs), m);
  q.name = n;
  q.position.set(x, y, z);
  q.castShadow = true;
  q.receiveShadow = true;
  world.add(q);
  return q;
}
function sprite(text, scale = 1) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(5,10,12,.92)';
  x.fillRect(0, 0, 512, 128);
  x.fillStyle = '#e8fbff';
  x.font = 'bold 40px sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText(text, 256, 64);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(3.2 * scale, 0.8 * scale, 1);
  return s;
}

// ========== ホーム骨格 ==========
// ホーム床（線路側を少し狭く）
box('platform', 2.5, 0, -30, 13, 0.45, 100, M.floor);
box('platformEdge', -3.2, 0.05, -30, 1.4, 0.12, 100, M.floorDark);

// 奥の壁・天井・側壁
box('backWall', 2.5, 4.2, -30, 13, 8, 100, M.wall);
box('ceiling', 2.5, 8.4, -30, 13, 0.4, 100, M.dark);
box('leftWall', -4.2, 4.2, -30, 0.5, 8, 100, M.dark);
box('rightWall', 9, 4.2, -30, 0.5, 8, 100, M.dark);

// ========== 線路 ==========
box('trackBed', -6.5, -0.55, -30, 6.5, 0.5, 100, M.black);
for (const x of [-7.8, -5.2]) {
  box('rail', x, -0.22, -30, 0.12, 0.14, 100, M.metal);
  box('railBase', x, -0.32, -30, 0.32, 0.08, 100, M.metal);
}
for (let z = 15; z > -85; z -= 2.1) {
  box('sleeper', -6.5, -0.42, z, 4.8, 0.14, 0.22, M.dark);
}

// ========== 黄色い安全線 + 点字ブロック ==========
box('yellowLine', -3.0, 0.28, -30, 0.28, 0.04, 100, M.yellow);
for (let z = 16; z > -85; z -= 0.65) {
  box('tactile', -3.0, 0.30, z, 0.55, 0.06, 0.38, M.yellow);
}

// ========== 柱（白タイル風丸柱） ==========
for (let z = 10; z > -80; z -= 9) {
  cyl('column', 5.5, 4.0, z, 0.55, 7.9, M.tile, 20);
  box('columnBand', 5.5, 0.35, z, 1.3, 0.4, 1.3, M.tileDark);
  box('columnBand2', 5.5, 7.6, z, 1.3, 0.25, 1.3, M.tileDark);
}

// ========== 照明 ==========
for (let z = 12; z > -82; z -= 7) {
  box('lamp', 2.5, 8.15, z, 4.5, 0.12, 0.4, M.white);
  const l = new THREE.PointLight(0xdceeff, 1.15, 14, 2);
  l.position.set(2.5, 7.7, z);
  world.add(l);
}

// ========== 壁タイル ==========
for (let z = 14; z > -84; z -= 3.8) {
  for (let y = 1.2; y < 7.5; y += 1.2) {
    box('tileR', 8.7, y, z, 0.08, 1.1, 3.5, M.tile);
  }
}

// ========== 駅名標 ==========
for (let z = 8; z > -78; z -= 20) {
  const s = sprite('第零駅  ZERO STATION', 1.1);
  s.position.set(2.5, 6.4, z);
  world.add(s);
}

// ========== ベンチ ==========
for (const z of [4, -18, -42, -64]) {
  box('benchSeat', 6.8, 0.95, z, 0.55, 0.18, 2.8, M.bench);
  box('benchBack', 7.15, 1.55, z, 0.12, 1.0, 2.8, M.bench);
  for (const zz of [z - 1.1, z + 1.1]) {
    cyl('benchLeg', 6.8, 0.5, zz, 0.07, 0.9, M.metal);
  }
}

// ========== 自販機 ==========
for (const z of [-8, -48]) {
  box('vending', 8.2, 1.7, z, 0.7, 2.8, 1.1, M.ad, true);
  box('vendingGlow', 7.85, 1.9, z, 0.04, 1.4, 0.7, M.glass);
}

// ========== 広告・案内 ==========
for (const z of [-2, -28, -55]) {
  box('ad', 8.7, 3.4, z, 0.1, 1.7, 2.6, M.ad);
  const a = sprite(z === -28 ? '帰り道を忘れないで' : 'あなたは今、どこにいる？', 0.7);
  a.position.set(8.55, 3.4, z);
  a.rotation.y = -Math.PI / 2;
  world.add(a);
}
box('mapBoard', 8.7, 4.9, -14, 0.1, 1.5, 2.4, M.black);
const mt = sprite('LINE 00 / 01 / 02', 0.65);
mt.position.set(8.55, 4.9, -14);
mt.rotation.y = -Math.PI / 2;
world.add(mt);

// ========== 非常口 ==========
for (const z of [-6, -36, -66]) {
  box('emergency', 8.55, 1.7, z, 0.2, 1.4, 0.9, M.red);
  const t = sprite('非常口', 0.45);
  t.position.set(8.4, 1.75, z);
  t.rotation.y = -Math.PI / 2;
  world.add(t);
}

// ========== トンネル口 ==========
box('tunnelTop', -3, 5.5, -82, 14, 5, 1.2, M.black);
box('tunnelL', -9.5, 2.5, -82, 1.5, 6, 1.2, M.black);
box('tunnelR', 4, 2.5, -82, 1.5, 6, 1.2, M.black);

// ========== 停車中の車両（参考画像寄り） ==========
function makeTrain() {
  const train = new THREE.Group();
  train.name = 'train';

  // 車体本体
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 3.2, 22), M.train);
  body.position.set(0, 1.7, 0);
  body.castShadow = true;
  body.receiveShadow = true;
  train.add(body);

  // 屋根
  const roof = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.25, 22.2), M.trainDark);
  roof.position.set(0, 3.35, 0);
  train.add(roof);

  // 側面ストライプ
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.35, 21.5), M.white);
  stripe.position.set(1.72, 1.4, 0);
  train.add(stripe);

  // 窓（複数）
  for (let i = -4; i <= 4; i++) {
    if (i === 0) continue; // ドア部分はスキップ
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.15, 1.6), M.glassDark);
    win.position.set(1.72, 2.15, i * 2.15);
    train.add(win);
  }

  // 開いたドア（中央）
  const doorOpen = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.3, 1.5), M.trainDark);
  doorOpen.position.set(1.75, 1.35, 0);
  train.add(doorOpen);

  // ドア内側の床
  const doorFloor = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 1.4), M.floorDark);
  doorFloor.position.set(1.0, 0.15, 0);
  train.add(doorFloor);

  // 座席（開いたドアから見える）
  for (const side of [-0.55, 0.55]) {
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 1.1), M.seat);
    seat.position.set(0.3, 0.85, side);
    train.add(seat);
    const seatBack = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.9, 1.1), M.seat);
    seatBack.position.set(-0.05, 1.3, side);
    train.add(seatBack);
  }

  // 前面ライト
  const headL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.15), M.white);
  headL.position.set(1.0, 1.5, 11.1);
  train.add(headL);
  const headR = headL.clone();
  headR.position.x = -1.0;
  train.add(headR);

  // 前面ガラス
  const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.4, 0.1), M.glassDark);
  frontGlass.position.set(0, 2.3, 11.05);
  train.add(frontGlass);

  // 連結器っぽいもの
  const coupler = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.5), M.metal);
  coupler.position.set(0, 0.6, 11.2);
  train.add(coupler);

  train.position.set(-6.5, 0, -8);
  train.rotation.y = 0;
  world.add(train);
  return train;
}
makeTrain();

// 2両目（少し奥）
function makeTrain2() {
  const train = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 3.2, 18), M.train);
  body.position.set(0, 1.7, 0);
  body.castShadow = true;
  train.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.25, 18.2), M.trainDark);
  roof.position.set(0, 3.35, 0);
  train.add(roof);
  for (let i = -3; i <= 3; i++) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.15, 1.5), M.glassDark);
    win.position.set(1.72, 2.15, i * 2.2);
    train.add(win);
  }
  train.position.set(-6.5, 0, -32);
  world.add(train);
}
makeTrain2();

// ライト
scene.add(new THREE.HemisphereLight(0x9fb4c0, 0x020304, 0.5));
const moon = new THREE.DirectionalLight(0xa8c7d6, 0.4);
moon.position.set(-12, 18, 8);
moon.castShadow = true;
scene.add(moon);

const flash = new THREE.SpotLight(0xdff6ff, 8, 30, Math.PI / 8, 0.45, 1.3);
scene.add(flash);
scene.add(flash.target);
let lightOn = true;

const keys = {}, player = { speed: 4.2, radius: 0.45 };
let yaw = 0, pitch = 0, sensitivity = 1, brightness = 1, started = false;

function move(dx, dz) {
  const nx = camera.position.x + dx;
  const nz = camera.position.z + dz;
  // ホーム範囲制限（線路に落ちないように）
  camera.position.x = Math.max(-2.6, Math.min(8.2, nx));
  camera.position.z = Math.max(-78, Math.min(16, nz));
}

const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let joy = { x: 0, y: 0 }, joyId = null;
stick.onpointerdown = e => { joyId = e.pointerId; stick.setPointerCapture(e.pointerId); };
stick.onpointermove = e => {
  if (e.pointerId !== joyId) return;
  const r = stick.getBoundingClientRect();
  const x = (e.clientX - (r.left + r.width / 2)) / 48;
  const y = (e.clientY - (r.top + r.height / 2)) / 48;
  const l = Math.hypot(x, y), k = Math.max(1, l);
  joy = { x: x / k, y: y / k };
  knob.style.transform = `translate(${joy.x * 32}px,${joy.y * 32}px)`;
};
stick.onpointerup = () => { joy = { x: 0, y: 0 }; knob.style.transform = ''; joyId = null; };

const look = document.getElementById('look');
let lookId = null, lx = 0, ly = 0;
look.onpointerdown = e => { lookId = e.pointerId; lx = e.clientX; ly = e.clientY; look.setPointerCapture(e.pointerId); };
look.onpointermove = e => {
  if (e.pointerId !== lookId) return;
  yaw -= (e.clientX - lx) * 0.0045 * sensitivity;
  pitch -= (e.clientY - ly) * 0.0035 * sensitivity;
  lx = e.clientX; ly = e.clientY;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
  camera.rotation.set(pitch, yaw, 0);
};
look.onpointerup = () => lookId = null;

function say(t) {
  const m = document.getElementById('message');
  m.textContent = t;
  m.classList.add('show');
  clearTimeout(say.t);
  say.t = setTimeout(() => m.classList.remove('show'), 2600);
}

document.getElementById('interact').onclick = () => {
  const z = camera.position.z;
  if (z < -70) say('トンネルの奥から、列車ではない音がする。');
  else if (z < -50) say('掲示板の文字が変わった。「ここから先は駅ではない」');
  else if (z < -30) say('電源が切れているはずの自販機が動いている。');
  else if (z < -5) say('開いたドアの奥に、誰かの気配がする。');
  else say('普通の地下鉄ホームに見える。今は。');
};

document.getElementById('flashBtn').onclick = () => {
  lightOn = !lightOn;
  flash.intensity = lightOn ? 8 : 0;
};

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'f' || e.key === 'F') { lightOn = !lightOn; flash.intensity = lightOn ? 8 : 0; } });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('startBtn').onclick = () => {
  document.getElementById('start').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
};
document.getElementById('soloBtn').onclick = () => openMap('SOLO');
document.getElementById('multiBtn').onclick = () => openMap('MULTIPLAYER');
document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('mapPanel').style.display = 'none';
  document.getElementById('settingsPanel').style.display = 'block';
  document.getElementById('subMenu').style.display = 'grid';
};
function openMap(mode) {
  document.getElementById('panelTitle').textContent = 'SELECT MAP — ' + mode;
  document.getElementById('mapPanel').style.display = 'block';
  document.getElementById('settingsPanel').style.display = 'none';
  document.getElementById('subMenu').style.display = 'grid';
}
document.querySelectorAll('.card').forEach(c => c.onclick = () => {
  document.getElementById('subMenu').style.display = 'none';
  document.getElementById('menu').style.display = 'none';
  started = true;
  say(c.dataset.map === 'zero' ? 'ZERO STATION — 調査開始' : 'NIGHT PLATFORM — 調査開始');
  if (innerWidth > 800) renderer.domElement.requestPointerLock?.();
});
document.getElementById('backBtn').onclick = () => document.getElementById('subMenu').style.display = 'none';
document.getElementById('settingsBack').onclick = () => document.getElementById('subMenu').style.display = 'none';
document.getElementById('sens').oninput = e => {
  sensitivity = +e.target.value;
  document.getElementById('sensVal').textContent = sensitivity.toFixed(1);
};
document.getElementById('bright').oninput = e => {
  brightness = +e.target.value;
  document.getElementById('brightVal').textContent = brightness.toFixed(1);
  renderer.toneMappingExposure = 1.05 * brightness;
};
renderer.domElement.onclick = () => {
  if (started && innerWidth > 800) renderer.domElement.requestPointerLock?.();
};
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0025 * sensitivity;
  pitch -= e.movementY * 0.002 * sensitivity;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

let last = performance.now(), eventDone = false, eventTime = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.035, (now - last) / 1000);
  last = now;
  if (started) {
    let f = 0, s = 0;
    if (keys.w || keys.arrowup) f++;
    if (keys.s || keys.arrowdown) f--;
    if (keys.a || keys.arrowleft) s--;
    if (keys.d || keys.arrowright) s++;
    f -= joy.y; s += joy.x;
    const l = Math.hypot(f, s);
    if (l > 1) { f /= l; s /= l; }
    const d = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const q = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    move((d.x * f + q.x * s) * player.speed * dt, (d.z * f + q.z * s) * player.speed * dt);
    flash.position.copy(camera.position);
    flash.target.position.set(
      camera.position.x - Math.sin(yaw) * 5,
      camera.position.y + Math.sin(pitch) * 5,
      camera.position.z - Math.cos(yaw) * 5
    );
    eventTime += dt;
    if (!eventDone && camera.position.z < -45 && eventTime > 6) {
      eventDone = true;
      document.getElementById('objective').textContent = '目的：さっきの広告をもう一度確認する';
      say('……後ろで足音がした。');
      document.getElementById('danger').style.opacity = '.45';
      setTimeout(() => document.getElementById('danger').style.opacity = '0', 900);
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script></body></html>
