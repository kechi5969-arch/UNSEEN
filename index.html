<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>地図にない場所 - iPhone版</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#050608;color:#eee;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#game{height:100vh;position:relative;background:radial-gradient(circle at 50% 45%,#222 0,#0c0d0f 38%,#030405 100%)}
#hud{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;z-index:5;text-shadow:0 2px 4px #000}
.badge{background:#111b;border:1px solid #555;border-radius:8px;padding:7px 10px}
#danger{position:absolute;top:62px;left:50%;transform:translateX(-50%);padding:7px 18px;border-radius:20px;background:#163b25;border:1px solid #3a7}
#world{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#station{position:relative;width:min(900px,92vw);height:min(520px,70vh);border:2px solid #444;background:
linear-gradient(90deg,transparent 49.6%,#333 49.6%,#333 50.4%,transparent 50.4%),
linear-gradient(#17191b,#0b0c0e);box-shadow:0 0 50px #000 inset}
.platform{position:absolute;left:5%;right:5%;height:90px;background:#282b2e;border-top:4px solid #555;border-bottom:4px solid #111}
.p1{top:18%}.p2{bottom:18%}
.rail{position:absolute;left:8%;right:8%;height:10px;background:#777;box-shadow:0 18px #555}.r1{top:43%}.r2{top:55%}
#player{position:absolute;width:26px;height:26px;border-radius:50%;background:#bde;box-shadow:0 0 16px #9cf;z-index:3;transition:.08s}
.obj{position:absolute;font-size:27px;cursor:pointer;filter:drop-shadow(0 0 7px #fff8);z-index:2}
#monster{position:absolute;width:34px;height:55px;border-radius:50% 50% 35% 35%;background:#050505;box-shadow:0 0 18px #a00;display:none;z-index:4}
#monster:after{content:"••";position:absolute;color:#f33;font-size:22px;left:8px;top:8px;letter-spacing:7px}
#message{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid #555;border-radius:10px;padding:10px 16px;opacity:0;transition:.2s;z-index:6}
#controls{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:7}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:#15181b;color:#fff;border:1px solid #777;border-radius:9px;padding:11px 15px;font-size:15px}
button:active{transform:scale(.96)} #start,#result{position:absolute;inset:0;background:#050608f5;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center}
.panel{width:min(560px,90vw);padding:28px;border:1px solid #555;border-radius:16px;background:#111419;box-shadow:0 20px 80px #000}
h1{font-size:30px;margin:0 0 8px}.sub{color:#aaa;line-height:1.7}.big{font-size:46px;margin:15px}.hidden{display:none!important}
#cameraFlash{position:absolute;inset:0;background:white;opacity:0;z-index:15;pointer-events:none}
@media(max-width:600px){#station{height:62vh}.badge{font-size:13px}.platform{height:70px}#controls{flex-wrap:wrap;width:95%;justify-content:center}button{padding:10px 12px}}
</style>

<style id="final-upgrade-css">
#game:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.68) 100%);opacity:.8}
#game.hunt:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:rgba(110,0,0,.13);animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.2}to{opacity:.65}}
#decision{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:min(680px,94vw);background:#090a0ced;border:1px solid #666;border-radius:14px;padding:14px;z-index:12;display:none;box-shadow:0 10px 40px #000}
#decision h3{margin:0 0 8px;font-size:17px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#decision button{min-height:48px}#status{position:absolute;top:105px;left:50%;transform:translateX(-50%);font-size:12px;color:#aaa;z-index:6;white-space:nowrap}
#noise{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#warning{position:absolute;inset:0;z-index:13;display:none;align-items:center;justify-content:center;pointer-events:none;color:#f44;font-weight:800;font-size:clamp(28px,8vw,64px);text-shadow:0 0 18px #f00;letter-spacing:.15em}
@media(max-width:600px){#decision{bottom:112px}.choices{grid-template-columns:1fr}#status{top:100px}}
</style>

</head>
<body>
<div id="game">
  <div id="hud">
    <div class="badge">残り時間 <b id="time">15:00</b></div>
    <div class="badge">暫定 <b id="score">0</b> pt</div>
  </div>
  <div id="danger">🟢 普通　倍率 ×1</div>
  <div id="world">
    <div id="station">
      <div class="platform p1"></div><div class="platform p2"></div>
      <div class="rail r1"></div><div class="rail r2"></div>
      <div id="player"></div><div id="monster"></div>
      <div class="obj" id="part" title="部品">🔧</div>
      <div class="obj" id="anomaly" title="異常">⚠️</div>
      <div class="obj" id="photo" title="写真対象">📷</div>
      <div class="obj" id="phenomenon" title="現象">👁️</div>
      <div class="obj" id="exit" title="脱出地点">🚇</div>
    </div>
  </div>
  <div id="message"></div>

  <div id="status">異常値：0　／　安全度：3　／　判断待ち：なし</div>
  <div id="noise"></div>
  <div id="warning">見られている</div>
  <div id="decision">
    <h3 id="decisionTitle">判断してください</h3>
    <div class="choices">
      <button id="choiceA"></button><button id="choiceB"></button>
    </div>
  </div>

  <div id="controls">
    <button data-k="up">↑</button><button data-k="left">←</button><button data-k="down">↓</button><button data-k="right">→</button>
    <button id="shoot">📷 撮影</button><button id="escape">🚇 脱出</button>
  </div>
  <div id="cameraFlash"></div>
  <div id="start"><div class="panel">
    <h1>地図にない場所</h1>
    <div class="sub">🚇 地図にない地下鉄 — プロトタイプ<br><br>
    調査してポイントを稼ぎ、危険になる前に帰還しよう。<br>
    <b>死亡すると今回のポイントは0。</b></div>
    <br><button id="startBtn">調査を開始</button>
  </div></div>
  <div id="result" class="hidden"><div class="panel">
    <h1 id="resultTitle">🏆 調査結果</h1>
    <div class="big" id="finalScore">0 pt</div>
    <div id="stats"></div><br>
    <button id="retry">もう一度調査</button>
  </div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let running=false,dead=false,score=0,time=900,last=0,shot=0,found=0,photos=0;
let anomaly=0,safety=3,decisions=0,eventsSeen=0,pending=null;
let p={x:50,y:50},m={x:80,y:20},objs={};
const station=$('station');
const basePositions={part:[18,25],anomaly:[75,22],photo:[28,73],phenomenon:[72,70],exit:[50,87]};

function reset(){
 running=false;dead=false;score=0;time=900;found=0;photos=0;shot=0;
 anomaly=0;safety=3;decisions=0;eventsSeen=0;pending=null;p={x:50,y:50};m={x:80,y:20};
 $('game').classList.remove('hunt');$('decision').style.display='none';$('warning').style.display='none';
 Object.entries(basePositions).forEach(([id,[x,y]])=>{objs[id]=true;let e=$(id);e.style.left=x+'%';e.style.top=y+'%';e.style.display='block'});
 $('monster').style.display='none';update();
}
function mult(){return safety<=0?3:time>600?1:time>300?2:3}
function update(){
 $('time').textContent=Math.floor(time/60).toString().padStart(2,'0')+':'+Math.floor(time%60).toString().padStart(2,'0');
 $('score').textContent=Math.max(0,score).toLocaleString();
 $('danger').textContent=safety>=3?'🟢 安全　倍率 ×1':safety===2?'🟡 注意　倍率 ×1':safety===1?'🟠 危険　倍率 ×2':'🔴 異常　倍率 ×3';
 $('danger').style.background=safety>=3?'#163b25':safety===2?'#403b12':safety===1?'#4b3512':'#4b1515';
 $('player').style.left=p.x+'%';$('player').style.top=p.y+'%';$('monster').style.left=m.x+'%';$('monster').style.top=m.y+'%';
 $('status').textContent=`異常値：${anomaly}　／　安全度：${safety}　／　判断待ち：${pending?'あり':'なし'}`;
}
function msg(t){$('message').textContent=t;$('message').style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>$('message').style.opacity=0,2200)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function addAnomaly(n=1){anomaly=Math.min(10,anomaly+n);safety=Math.max(0,3-Math.floor(anomaly/3));update()}

function maybeDecision(){
 if(decisions>=4||pending||Math.random()>.55)return;
 decisions++;
 const events=[
 ['遠くのホームから、こちらを呼ぶ声がした。','声のする方へ行く','無視して調査を続ける',
  ()=>{addAnomaly(2);score+=250;msg('声について行った。何かを見た… +250pt')},
  ()=>{safety=Math.min(3,safety+1);msg('声は聞かなかったことにした。')}],
 ['📷 撮影した写真に、知らない人影が写っている。','もう一度撮影する','写真を消す',
  ()=>{addAnomaly(2);score+=300;photos++;msg('人影を記録した。 +300pt')},
  ()=>{anomaly=Math.max(0,anomaly-1);msg('写真を消した。少し安心した。')}],
 ['案内板の駅名が一瞬だけ変わった。','駅名を記録する','見なかったことにする',
  ()=>{score+=200;addAnomaly(1);msg('存在しない駅名を記録した。 +200pt')},
  ()=>{safety=Math.min(3,safety+1);msg('目を逸らした。')}],
 ['後ろから足音。あなたが止まると、足音も止まった。','振り返る','振り返らない',
  ()=>{addAnomaly(3);eventsSeen++;msg('振り返った。誰もいない。…本当に？')},
  ()=>{score+=150;msg('振り返らなかった。 +150pt')}]
 ];
 const ev=events[Math.floor(Math.random()*events.length)];
 pending={a:ev[3],b:ev[4]};
 $('decisionTitle').textContent=ev[0];$('choiceA').textContent=ev[1];$('choiceB').textContent=ev[2];
 $('decision').style.display='block';msg('判断が必要です。');
}
function choose(which){if(!pending)return;const fn=which==='a'?pending.a:pending.b;pending=null;$('decision').style.display='none';fn();update()}
$('choiceA').onclick=()=>choose('a');$('choiceB').onclick=()=>choose('b');

function interact(id,base,label){
 if(!objs[id]||!running||dead)return;
 const e=$(id),r=e.getBoundingClientRect(),s=station.getBoundingClientRect();
 const o={x:(r.left-s.left)/s.width*100,y:(r.top-s.top)/s.height*100};
 if(Math.hypot(p.x-o.x,p.y-o.y)>10){msg('もう少し近づいてください');return}
 objs[id]=false;e.style.display='none';let pts=base*mult();score+=pts;found++;
 if(id==='anomaly'||id==='phenomenon')addAnomaly(id==='phenomenon'?2:1);
 msg(label+'！ +'+pts+'pt');maybeDecision();update();
}
function capture(){
 if(!running||dead||pending)return;
 const near=distance(p,m)<20,flash=$('cameraFlash');flash.style.opacity=.9;setTimeout(()=>flash.style.opacity=0,80);shot++;
 if(near&&$('monster').style.display!=='none'){let pts=500*mult();score+=pts;photos++;msg('👹 化け物を撮影！ +'+pts+'pt');m.x=Math.min(94,m.x+10);m.y=Math.min(94,m.y+7);addAnomaly(1)}
 else if(Math.random()<.5){let pts=150*mult();score+=pts;photos++;msg('📷 写真対象を記録！ +'+pts+'pt')}
 else msg('📷 撮影したが、有効な記録ではない…');
 update();
}
function die(reason='化け物に捕まった。'){
 dead=true;running=false;$('game').classList.remove('hunt');$('resultTitle').textContent='💀 調査失敗';$('finalScore').textContent='0 pt';
 $('stats').innerHTML=reason+'<br>今回のポイントはすべて失われました。';$('result').classList.remove('hidden');
}
function finish(){
 if(!running||dead||pending)return;const ex={x:50,y:87};
 if(Math.hypot(p.x-ex.x,p.y-ex.y)>13){msg('🚇 脱出地点まで戻ってください');return}
 if(time<20){msg('脱出操作に時間が必要です！');return}
 running=false;$('resultTitle').textContent='🏆 生還！';$('finalScore').textContent=Math.max(0,score).toLocaleString()+' pt';
 $('stats').innerHTML=`発見した調査対象：${found}件<br>写真・撮影記録：${photos}件<br>遭遇した異常：${eventsSeen}件<br>最終安全度：${safety}/3<br>生還：✅`;
 $('result').classList.remove('hidden');
}
function randomHorror(){
 if(!running||dead||pending)return;
 const h=['…誰かがあなたの名前を呼んだ。','電灯が一つだけ消えた。','さっきまで無かった足跡がある。','時計の秒針だけが止まった。','遠くで電車が来た。時刻表にはない。','📷 カメラを向けた瞬間、何かが横切った。'];
 msg(h[Math.floor(Math.random()*h.length)]);addAnomaly(1);eventsSeen++;
 if(anomaly>=8){$('warning').style.display='flex';setTimeout(()=>$('warning').style.display='none',700)}
}
function tick(t){
 if(!running)return;if(!last)last=t;let dt=(t-last)/1000;last=t;time-=dt;
 if(time<=0){time=0;update();die('時間切れ。帰還する前に、駅が閉じた。');return}
 const speed=safety<=0?.095:safety===1?.075:.055,dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
 if(time<650||safety<=1)$('monster').style.display='block';
 if(d<30){m.x+=dx/(d||1)*speed*12;m.y+=dy/(d||1)*speed*12}
 if(d<5)die('化け物に捕まった。');
 if(Math.random()<.0018+anomaly*.0005)randomHorror();
 if(safety<=0)$('game').classList.add('hunt');else $('game').classList.remove('hunt');
 update();requestAnimationFrame(tick);
}
function move(dx,dy){
 if(!running||dead||pending)return;const len=Math.hypot(dx,dy)||1;
 p.x=Math.max(3,Math.min(97,p.x+dx/len*2));p.y=Math.max(4,Math.min(94,p.y+dy/len*2));update();
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>({up:()=>move(0,-1),down:()=>move(0,1),left:()=>move(-1,0),right:()=>move(1,0)}[b.dataset.k])());
document.addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')move(0,-1);if(e.key==='s'||e.key==='ArrowDown')move(0,1);if(e.key==='a'||e.key==='ArrowLeft')move(-1,0);if(e.key==='d'||e.key==='ArrowRight')move(1,0);if(e.code==='Space')capture();if(e.key==='e')finish()});
$('shoot').onclick=capture;$('escape').onclick=finish;
$('startBtn').onclick=()=>{reset();$('start').classList.add('hidden');running=true;last=0;requestAnimationFrame(tick);msg('調査開始。ここは本当に地図にある駅だろうか。')};
$('retry').onclick=()=>{$('result').classList.add('hidden');reset();running=true;last=0;requestAnimationFrame(tick);msg('再調査開始。今回は、何を信じる？')};
reset();
$('part').onclick=()=>interact('part',50,'🔧 部品を発見');$('anomaly').onclick=()=>interact('anomaly',100,'⚠️ 異常を記録');
$('photo').onclick=()=>interact('photo',150,'📷 写真対象を発見');$('phenomenon').onclick=()=>interact('phenomenon',250,'👁️ 現象を記録');
</script>
</body>
</html>
