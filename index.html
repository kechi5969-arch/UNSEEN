<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>UNSEEN — 地下鉄ホーム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eef7fa;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}#title{position:absolute;top:14px;left:16px;font-weight:900;letter-spacing:.22em;font-size:13px}#station{position:absolute;top:38px;left:16px;color:#aebcc4;font-size:11px}
#objective{position:absolute;left:16px;top:70px;max-width:330px;padding:9px 11px;border:1px solid #ffffff22;border-radius:9px;background:#05090dcc;font-size:12px}#hint{position:absolute;right:14px;top:14px;color:#aeb8bf;font-size:10px;text-align:right}#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#dff7ff;border-radius:50%;box-shadow:0 0 8px #9fe7ff}
#message{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:min(88vw,520px);text-align:center;padding:12px 16px;border-radius:10px;background:#020405d9;border:1px solid #ffffff1a;font-size:13px;opacity:0;transition:opacity .25s}.show{opacity:1!important}
#danger{position:absolute;inset:0;background:#ff001010;box-shadow:inset 0 0 110px #f001;opacity:0;transition:opacity .2s}
#touch{position:fixed;inset:0;z-index:10;pointer-events:none}#stick{position:absolute;left:20px;bottom:28px;width:128px;height:128px;border:1px solid #ffffff24;border-radius:50%;background:#ffffff08;pointer-events:auto;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#dff8ff18;border:1px solid #dff8ff55}
#look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none}#interact,#flashBtn{position:absolute;border-radius:50%;border:1px solid #bcefff55;background:#081117bb;color:#dff8ff;pointer-events:auto;touch-action:manipulation}#interact{right:22px;bottom:42px;width:70px;height:70px;font-weight:800}#flashBtn{right:104px;bottom:52px;width:50px;height:50px}
#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#17222b,#030405 65%);padding:24px}#startBox{width:min(520px,92vw);padding:28px;border:1px solid #ffffff22;border-radius:16px;background:#070a0edb;text-align:center}#startBox h1{margin:0 0 8px;font-size:42px;letter-spacing:.2em}#startBox p{margin:8px 0;color:#aab7bf;line-height:1.6;font-size:13px}#startBtn{margin-top:14px;width:100%;padding:14px;border-radius:10px;border:1px solid #9fe7ff88;background:#0c2029;color:#eafaff;font-weight:900}

/* UNSEEN MENU */
#menu{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.28)),radial-gradient(circle at 72% 38%,#25333c,#050607 68%);padding:clamp(24px,5vw,70px)}
#menu .menuInner{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;width:min(720px,92vw);margin:auto}
.logo{font-size:clamp(54px,11vw,108px);font-weight:950;letter-spacing:.22em;text-shadow:0 0 28px #b9efff44;margin-bottom:32px}
.menuButtons{display:flex;flex-direction:column;gap:12px;width:min(330px,80vw)}
.menuBtn{padding:15px 20px;text-align:left;border:1px solid #dff8ff44;border-radius:8px;background:#071015cc;color:#effcff;font-weight:900;letter-spacing:.16em;cursor:pointer}
.menuBtn:hover{background:#12303bcc;border-color:#dff8ff99}
#subMenu{position:fixed;inset:0;z-index:31;display:none;background:#050708f2;padding:30px}
.panel{width:min(620px,92vw);margin:auto;padding:28px;border:1px solid #ffffff22;border-radius:14px;background:#091014f5}
.panel h2{letter-spacing:.16em;margin-top:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:22px;border:1px solid #ffffff25;border-radius:10px;background:#10191dcc;cursor:pointer}.card:hover{border-color:#bcefff99}.back{margin-top:18px;background:none;border:0;color:#9eafb8;cursor:pointer}
.setting{margin:22px 0}.setting label{display:flex;justify-content:space-between;margin-bottom:8px}.setting input{width:100%}
@media(min-width:800px){#stick,#look,#interact,#flashBtn{display:none}}
</style></head><body>
<div id="start"><div id="startBox"><h1>UNSEEN</h1><p>地下鉄ホーム — PROTOTYPE 01</p><p>終電後の駅を調査する。<br>……ただし、駅員の案内を信用してはいけない。</p><button id="startBtn">調査を開始</button></div></div>
<div id="menu"><div class="menuInner"><div class="logo">UNSEEN</div><div class="menuButtons"><button class="menuBtn" id="soloBtn">SOLO</button><button class="menuBtn" id="multiBtn">MULTIPLAYER</button><button class="menuBtn" id="settingsBtn">SETTINGS</button></div></div></div>
<div id="subMenu"><div class="panel" id="mapPanel">
<h2 id="panelTitle">SELECT MAP</h2><div class="cards"><div class="card" data-map="zero"><b>ZERO STATION</b><br><small>地下鉄・第零駅</small></div><div class="card" data-map="night"><b>NIGHT PLATFORM</b><br><small>深夜のホーム</small></div></div><button class="back" id="backBtn">← BACK</button>
</div>
<div class="panel" id="settingsPanel" style="display:none"><h2>SETTINGS</h2>
<div class="setting"><label>感度 <span id="sensVal">1.0</span></label><input id="sens" type="range" min=".4" max="2" step=".1" value="1"></div>
<div class="setting"><label>明るさ <span id="brightVal">1.0</span></label><input id="bright" type="range" min=".5" max="1.5" step=".1" value="1"></div>
<button class="back" id="settingsBack">← BACK</button></div></div>
<div id="hud"><div id="title">UNSEEN</div><div id="station">地下鉄 / 第零駅</div><div id="objective">目的：ホームを調査する</div><div id="hint">PC: WASD / マウス　　iPhone: 左スティック / 右側ドラッグ</div><div id="crosshair"></div><div id="danger"></div><div id="message"></div></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div id="look"></div><button id="flashBtn">LIGHT</button><button id="interact">調査</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x030506);scene.fog=new THREE.FogExp2(0x030506,.035);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.05,220);camera.position.set(0,1.72,12);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
const world=new THREE.Group();scene.add(world);
const M={floor:new THREE.MeshStandardMaterial({color:0x3a4144,roughness:.9}),wall:new THREE.MeshStandardMaterial({color:0x4c5659,roughness:.78}),tile:new THREE.MeshStandardMaterial({color:0x687376,roughness:.72}),dark:new THREE.MeshStandardMaterial({color:0x111517,roughness:.95}),metal:new THREE.MeshStandardMaterial({color:0x4d565a,roughness:.35,metalness:.7}),yellow:new THREE.MeshStandardMaterial({color:0xd4ad18,roughness:.65}),white:new THREE.MeshStandardMaterial({color:0xdfe7e9,roughness:.65}),black:new THREE.MeshStandardMaterial({color:0x080a0b,roughness:1}),glass:new THREE.MeshStandardMaterial({color:0x9ed8df,roughness:.18,metalness:.2,transparent:true,opacity:.32}),ad:new THREE.MeshStandardMaterial({color:0x182a31,roughness:.65}),red:new THREE.MeshStandardMaterial({color:0x9d1c22,roughness:.7})};
function box(n,x,y,z,sx,sy,sz,m,cast=false){const q=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);q.name=n;q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=true;world.add(q);return q}
function cyl(n,x,y,z,r,h,m){const q=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);q.name=n;q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;world.add(q);return q}
function sprite(text,scale=1){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle='rgba(5,10,12,.9)';x.fillRect(0,0,512,128);x.fillStyle='#e8fbff';x.font='bold 44px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,64);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(3.2*scale,.8*scale,1);return s}

// 駅の骨格
box('platform',0,0,-33,18,.5,90,M.floor);box('backWall',0,4.2,-33,18,8,90,M.wall);box('ceiling',0,8.5,-33,18,.5,90,M.dark);box('leftWall',-9,4.2,-33,.5,8,90,M.dark);box('rightWall',9,4.2,-33,.5,8,90,M.dark);
// 線路
box('trackBed',0,-.15,-48,7,.25,74,M.black);for(const x of [-2.15,2.15]){box('rail',x,.04,-48,.13,.13,74,M.metal);box('rail2',x,.02,-48,.38,.08,74,M.metal)}for(let z=-10;z>-84;z-=2.2)box('sleeper',0,-.03,z,5.2,.12,.18,M.dark);
// 黄色線・点字
box('yellowLine',0,.27,-33,7,.035,90,M.yellow);for(let z=8;z>-84;z-=.7){box('tactile',-3,.29,z,.22,.05,.34,M.yellow);box('tactile2',3,.29,z,.22,.05,.34,M.yellow)}
// 柱・照明
for(let z=7;z>-82;z-=8){for(const x of [-6.8,6.8]){cyl('column',x,4,z,.42,7.8,M.metal);box('columnBase',x,.45,z,1.05,.45,1.05,M.dark)}box('lamp',0,8.05,z,5.5,.1,.35,M.white);const l=new THREE.PointLight(0xdceeff,1.35,13,2);l.position.set(0,7.6,z);world.add(l)}
// タイル
for(let z=7;z>-84;z-=4)for(let y=1.3;y<7.6;y+=1.25){box('tile',-7.95,y,z,3.8,1.05,.045,M.tile);box('tileR',7.95,y,z,3.8,1.05,.045,M.tile)}
// 駅名標
for(let z=5;z>-80;z-=18){const s=sprite('第零駅  ZERO STATION',1.15);s.position.set(0,6.25,z-.08);world.add(s)}
// ベンチ
for(const z of [0,-22,-44,-66]){box('benchSeat',-5.8,1.05,z,3.2,.22,.65,M.metal);for(const x of [-7,-5.8,-4.6])cyl('benchLeg',x,.55,z,.09,1,M.metal);box('benchBack',-5.8,1.75,z-.28,3.2,1.1,.14,M.metal)}
// 自販機
for(const z of [-12,-50]){box('vending',-7.7,1.65,z,1.15,2.7,.75,M.ad,true);box('vendingGlow',-7.7,1.8,z-.39,.75,1.25,.03,M.glass)}
// 広告
for(const z of [-6,-30,-54]){box('ad',7.65,3.2,z,2.9,1.65,.12,M.ad);const a=sprite(z===-30?'帰り道を忘れないで':'あなたは今、どこにいる？',.72);a.position.set(7.58,3.2,z-.08);a.rotation.y=-Math.PI/2;world.add(a)}
// 案内板
box('mapBoard',-7.55,4.7,-15,2.7,1.65,.12,M.black);const mt=sprite('LINE 00 / 01 / 02',.7);mt.position.set(-7.48,4.7,-15);mt.rotation.y=-Math.PI/2;world.add(mt);
// トンネル
box('tunnelTop',0,6.8,-84,10,3.4,1,M.black);box('tunnelL',-4.5,3.3,-84,1,6.5,1,M.black);box('tunnelR',4.5,3.3,-84,1,6.5,1,M.black);
for(const z of [-9,-37,-65]){box('emergency',7.55,1.8,z,1,1.5,.25,M.red);const t=sprite('非常口',.5);t.position.set(7.4,1.85,z-.16);t.rotation.y=-Math.PI/2;world.add(t)}
scene.add(new THREE.HemisphereLight(0x9fb4c0,0x020304,.55));const moon=new THREE.DirectionalLight(0xa8c7d6,.5);moon.position.set(-10,16,12);moon.castShadow=true;scene.add(moon);
const flash=new THREE.SpotLight(0xdff6ff,8,30,Math.PI/8,.45,1.3);scene.add(flash);scene.add(flash.target);let lightOn=true;

const keys={},player={speed:3.2};let yaw=0,pitch=0,started=false;let sensitivity=1,brightness=1;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='f')toggleFlash()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toggleFlash(){lightOn=!lightOn;flash.intensity=lightOn?8:0;say(lightOn?'懐中電灯を点けた。':'懐中電灯を消した。')}document.getElementById('flashBtn').onclick=toggleFlash;
function move(dx,dz){camera.position.x=Math.max(-7.8,Math.min(7.8,camera.position.x+dx));camera.position.z=Math.max(-81,Math.min(11,camera.position.z+dz))}
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let joy={x:0,y:0},joyId=null;
stick.onpointerdown=e=>{joyId=e.pointerId;stick.setPointerCapture(e.pointerId)};stick.onpointermove=e=>{if(e.pointerId!==joyId)return;const r=stick.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/48,y=(e.clientY-(r.top+r.height/2))/48,l=Math.hypot(x,y),k=Math.max(1,l);joy={x:x/k,y:y/k};knob.style.transform=`translate(${joy.x*32}px,${joy.y*32}px)`};stick.onpointerup=()=>{joy={x:0,y:0};knob.style.transform='';joyId=null};
const look=document.getElementById('look');let lookId=null,lx=0,ly=0;look.onpointerdown=e=>{lookId=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-lx)*.0045*sensitivity;pitch-=(e.clientY-ly)*.0035*sensitivity;lx=e.clientX;ly=e.clientY;pitch=Math.max(-1.35,Math.min(1.35,pitch));camera.rotation.set(pitch,yaw,0)};look.onpointerup=()=>lookId=null;
function say(t){const m=document.getElementById('message');m.textContent=t;m.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>m.classList.remove('show'),2600)}
document.getElementById('interact').onclick=()=>{const z=camera.position.z;if(z<-74)say('トンネルの奥から、列車ではない音がする。');else if(z<-58)say('掲示板の文字が変わった。「ここから先は駅ではない」');else if(z<-34)say('電源が切れているはずの自販機が動いている。');else if(z<-12)say('広告に、さっきまで無かった文章がある。');else say('普通の地下鉄ホームに見える。今は。')};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('startBtn').onclick=()=>{
 document.getElementById('start').style.display='none';
 document.getElementById('menu').style.display='block';
};
document.getElementById('soloBtn').onclick=()=>openMap('SOLO');
document.getElementById('multiBtn').onclick=()=>openMap('MULTIPLAYER');
document.getElementById('settingsBtn').onclick=()=>{document.getElementById('mapPanel').style.display='none';document.getElementById('settingsPanel').style.display='block';document.getElementById('subMenu').style.display='grid'};
function openMap(mode){document.getElementById('panelTitle').textContent='SELECT MAP — '+mode;document.getElementById('mapPanel').style.display='block';document.getElementById('settingsPanel').style.display='none';document.getElementById('subMenu').style.display='grid'}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.getElementById('subMenu').style.display='none';document.getElementById('menu').style.display='none';started=true;say(c.dataset.map==='zero'?'ZERO STATION — 調査開始':'NIGHT PLATFORM — 調査開始');if(innerWidth>800)renderer.domElement.requestPointerLock?.()});
document.getElementById('backBtn').onclick=()=>document.getElementById('subMenu').style.display='none';
document.getElementById('settingsBack').onclick=()=>document.getElementById('subMenu').style.display='none';
document.getElementById('sens').oninput=e=>{sensitivity=+e.target.value;document.getElementById('sensVal').textContent=sensitivity.toFixed(1)};
document.getElementById('bright').oninput=e=>{brightness=+e.target.value;document.getElementById('brightVal').textContent=brightness.toFixed(1);renderer.toneMappingExposure=1.05*brightness};
renderer.domElement.onclick=()=>{if(started&&innerWidth>800)renderer.domElement.requestPointerLock?.()};
addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;yaw-=e.movementX*.0025*sensitivity;pitch-=e.movementY*.002*sensitivity;pitch=Math.max(-1.35,Math.min(1.35,pitch));camera.rotation.set(pitch,yaw,0)});

let last=performance.now(),eventDone=false,eventTime=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.035,(now-last)/1000);last=now;
if(started){let f=0,s=0;if(keys.w||keys.arrowup)f++;if(keys.s||keys.arrowdown)f--;if(keys.a||keys.arrowleft)s--;if(keys.d||keys.arrowright)s++;f-=joy.y;s+=joy.x;const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}const d=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),q=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));move((d.x*f+q.x*s)*player.speed*dt,(d.z*f+q.z*s)*player.speed*dt);flash.position.copy(camera.position);flash.target.position.set(camera.position.x-Math.sin(yaw)*5,camera.position.y+Math.sin(pitch)*5,camera.position.z-Math.cos(yaw)*5);
eventTime+=dt;if(!eventDone&&camera.position.z<-48&&eventTime>6){eventDone=true;document.getElementById('objective').textContent='目的：さっきの広告をもう一度確認する';say('……後ろで足音がした。');document.getElementById('danger').style.opacity='.45';setTimeout(()=>document.getElementById('danger').style.opacity='0',900)}}renderer.render(scene,camera)}
requestAnimationFrame(loop);
</script></body></html>
